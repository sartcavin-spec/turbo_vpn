<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo VPN - لیست سرورها</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: { brand: { dark: '#0f172a', purple: '#7c3aed', pink: '#db2777' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen pb-10">
    <div id="app" class="max-w-4xl mx-auto p-4 space-y-8">
        
        <!-- Header -->
        <header class="text-center space-y-4 pt-10">
            <div class="inline-block p-4 rounded-full glass mb-2 shadow-lg shadow-purple-500/20">
                <i class="fas fa-rocket text-4xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight text-white drop-shadow-lg">Turbo VPN</h1>
            
            <!-- Overall Sub Link -->
            <div class="glass rounded-xl p-4 max-w-xl mx-auto flex items-center gap-2">
                <input type="text" value="https://cdn.jsdelivr.net/gh/sartcavin-spec/turbo_vpn@main/sub.txt" readonly class="bg-transparent border-none text-slate-300 text-xs w-full focus:outline-none dir-ltr font-mono" onclick="this.select()">
                <button @click="copyText('https://cdn.jsdelivr.net/gh/sartcavin-spec/turbo_vpn@main/sub.txt')" class="text-pink-500 hover:text-pink-400"><i class="fas fa-copy text-xl"></i></button>
            </div>
        </header>

        <!-- Controls -->
        <div class="glass rounded-2xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between sticky top-4 z-20 shadow-xl bg-slate-900/80 backdrop-blur-md">
            <!-- Search/Filter -->
            <div class="flex items-center gap-3 w-full md:w-auto overflow-x-auto pb-2 md:pb-0 hide-scroll">
                <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-pink-600 text-white' : 'bg-slate-700 text-slate-400'" class="px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap">
                    همه ({{ servers.length }})
                </button>
                <button v-for="loc in locations" :key="loc" @click="filter = loc" :class="filter === loc ? 'bg-purple-600 text-white' : 'bg-slate-700 text-slate-400'" class="px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap flex items-center gap-2">
                   {{ loc }}
                </button>
            </div>
            
            <!-- Sort -->
            <div class="flex items-center gap-2 w-full md:w-auto">
                <span class="text-xs text-slate-400 whitespace-nowrap">مرتب‌سازی:</span>
                <select v-model="sortBy" class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 focus:outline-none w-full">
                    <option value="ping">⚡ کمترین پینگ</option>
                    <option value="newest">📅 جدیدترین</option>
                </select>
            </div>
        </div>

        <!-- Loading -->
        <div v-if="loading" class="text-center py-20">
            <i class="fas fa-circle-notch fa-spin text-4xl text-purple-500"></i>
            <p class="mt-4 text-slate-400 text-sm">در حال دریافت لیست سرورها...</p>
        </div>

        <!-- Empty State -->
        <div v-else-if="filteredServers.length === 0" class="text-center py-20 glass rounded-2xl">
            <i class="fas fa-ghost text-4xl text-slate-600"></i>
            <p class="mt-4 text-slate-400">هیچ سروری یافت نشد.</p>
        </div>

        <!-- Server Grid -->
        <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div v-for="server in filteredServers" :key="server.id" class="glass rounded-2xl p-4 hover:bg-slate-800/50 transition group relative overflow-hidden border-t border-white/5">
                
                <!-- Protocol Badge -->
                <div class="absolute top-0 left-0 bg-slate-800/80 px-3 py-1 rounded-br-xl text-[10px] font-mono text-slate-400 border-r border-b border-slate-700">
                    {{ getProtocol(server.config_data) }}
                </div>

                <div class="flex items-start justify-between mt-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-slate-700 flex items-center justify-center text-2xl shadow-inner">
                            {{ getFlag(server.name) }}
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-200 text-sm">{{ cleanName(server.name) }}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span :class="getPingColor(server.ping_time)" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-900 border border-current opacity-80">
                                    <i class="fas fa-bolt mr-1"></i> {{ server.ping_time }}ms
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button @click="copyText(server.config_data)" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-400 hover:text-white py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 border border-indigo-500/30">
                        <i class="fas fa-copy"></i> کپی
                    </button>
                    <button @click="showQR(server)" class="bg-slate-700/50 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 border border-slate-600/30">
                        <i class="fas fa-qrcode"></i> نمایش QR
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-600 text-xs mt-10">
            Design by Turbo VPN
        </footer>

        <!-- QR Modal -->
        <div v-if="qrModal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="absolute inset-0 modal-glass" @click="qrModal = null"></div>
            <div class="bg-white rounded-2xl p-6 relative z-10 shadow-2xl max-w-sm w-full text-center space-y-4">
                <h3 class="text-slate-900 font-bold text-lg">{{ qrModal.name }}</h3>
                <div id="modal-qr" class="flex justify-center border-4 border-slate-100 rounded-xl p-2"></div>
                <button @click="qrModal = null" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition">بستن</button>
            </div>
        </div>

    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    servers: [],
                    loading: true,
                    filter: 'all',
                    sortBy: 'ping',
                    qrModal: null,
                }
            },
            computed: {
                locations() {
                    const locs = new Set();
                    this.servers.forEach(s => {
                        const flag = this.getFlag(s.name);
                        if(flag !== '🌍') locs.add(flag);
                    });
                    return Array.from(locs);
                },
                filteredServers() {
                    let res = this.servers;
                    if (this.filter !== 'all') {
                        res = res.filter(s => this.getFlag(s.name) === this.filter);
                    }
                    return res.sort((a, b) => {
                        if (this.sortBy === 'ping') return parseInt(a.ping_time) - parseInt(b.ping_time);
                        if (this.sortBy === 'newest') return b.id - a.id;
                        return 0;
                    });
                }
            },
            mounted() {
                this.fetchData();
            },
            methods: {
                async fetchData() {
                    try {
                        const res = await fetch('https://cdn.jsdelivr.net/gh/sartcavin-spec/turbo_vpn@main/servers.json');
                        if (!res.ok) throw new Error('Failed');
                        const data = await res.json();
                        this.servers = data.servers || [];
                    } catch (e) {
                        console.error(e);
                    } finally {
                        this.loading = false;
                    }
                },
                getFlag(name) {
                    const regex = /[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]/;
                    const match = name && name.match(regex);
                    return match ? match[0] : '🌍';
                },
                cleanName(name) {
                    return name ? name.replace(/[\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF]/g, '').trim() : 'Server';
                },
                getProtocol(config) {
                    if (!config) return 'VPN';
                    if (config.startsWith('vmess')) return 'VMESS';
                    if (config.startsWith('vless')) return 'VLESS';
                    if (config.startsWith('trojan')) return 'TROJAN';
                    if (config.startsWith('ss')) return 'SHADOWSOCKS';
                    return 'VPN';
                },
                getPingColor(ping) {
                    const p = parseInt(ping);
                    if (p < 200) return 'text-green-400 border-green-400/30';
                    if (p < 500) return 'text-yellow-400 border-yellow-400/30';
                    return 'text-red-400 border-red-400/30';
                },
                copyText(text) {
                    navigator.clipboard.writeText(text);
                    alert('کپی شد! ✅');
                },
                showQR(server) {
                    this.qrModal = server;
                    this.$nextTick(() => {
                        document.getElementById('modal-qr').innerHTML = '';
                        new QRCode(document.getElementById("modal-qr"), {
                            text: server.config_data,
                            width: 200,
                            height: 200
                        });
                    });
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
