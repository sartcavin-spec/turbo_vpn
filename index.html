<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo VPN - اتصال هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            purple: '#7c3aed',
                            pink: '#db2777',
                            surface: '#1e293b'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(to right, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .blob {
            position: absolute;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Blobs -->
    <div class="blob bg-purple-500 w-64 h-64 rounded-full top-0 left-0 mix-blend-multiply animate-blob"></div>
    <div class="blob bg-pink-500 w-64 h-64 rounded-full top-0 right-0 mix-blend-multiply animate-blob animation-delay-2000"></div>
    <div class="blob bg-blue-500 w-64 h-64 rounded-full bottom-0 left-10 mix-blend-multiply animate-blob animation-delay-4000"></div>

    <main class="w-full max-w-md space-y-6 z-10">
        
        <!-- Header -->
        <div class="text-center space-y-2 animate-fade-in">
            <div class="inline-block p-4 rounded-full glass mb-2 shadow-lg shadow-purple-500/20">
                <i class="fas fa-rocket text-4xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight gradient-text drop-shadow-lg">Turbo VPN</h1>
            <p class="text-slate-400 text-sm font-medium">اتصال امن، سریع و پایداری که انتظارش را داشتید</p>
        </div>

        <!-- Subscription Card -->
        <div class="glass rounded-2xl p-6 space-y-6 shadow-2xl shadow-black/20 animate-fade-in border-t border-white/10" style="animation-delay: 0.1s;">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-300 flex items-center gap-2 uppercase tracking-wide">
                    <i class="fas fa-link text-pink-500"></i>
                    لینک اشتراک هوشمند
                </label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                       <span class="flex h-2.5 w-2.5 relative">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                        </span>
                    </div>
                    <input type="text" id="subLink" value="https://cdn.jsdelivr.net/gh/sartcavin-spec/turbo_vpn@main/sub.txt" readonly 
                           class="w-full bg-slate-900/60 border border-slate-700 text-slate-200 text-xs rounded-xl focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 focus:outline-none block w-full pl-8 pr-4 py-4 font-mono transition-all text-left dir-ltr truncate">
                    <button onclick="copyLink()" class="absolute inset-y-1 right-1 flex items-center">
                        <div class="bg-slate-700 hover:bg-pink-600 text-white p-2 rounded-lg transition-all cursor-pointer shadow-md">
                            <i class="fas fa-copy"></i>
                        </div>
                    </button>
                </div>
                <p id="copyMsg" class="text-xs text-green-400 h-4 text-center opacity-0 transition-opacity font-bold">کپی شد! ✅</p>
            </div>

            <!-- QR Code -->
            <div class="flex justify-center -mt-2">
                <div class="p-3 bg-white rounded-xl shadow-inner border-4 border-white/5">
                    <div id="qrcode"></div>
                </div>
            </div>
            
            <div class="text-center">
                <button onclick="copyLink()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-purple-900/40 transform transition hover:-translate-y-1 active:translate-y-0">
                    <i class="fas fa-magic mr-2 animate-pulse"></i>
                    کپی لینک اشتراک
                </button>
            </div>
        </div>

        <!-- Apps Section -->
        <div class="glass rounded-2xl p-5 space-y-4 animate-fade-in border-t border-white/5" style="animation-delay: 0.2s;">
            <h3 class="font-bold text-slate-200 text-sm flex items-center gap-2">
                <i class="fas fa-download text-teal-400"></i>
                اپلیکیشن‌های پیشنهادی
            </h3>
            <div class="grid grid-cols-2 gap-3">
                <a href="https://github.com/2dust/v2rayNG/releases/latest" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-slate-800/40 hover:bg-slate-700/60 transition border border-slate-700/50 group">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-lg font-bold text-white group-hover:bg-green-600 transition-colors">
                        <i class="fab fa-android"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-sm text-slate-200">v2rayNG</div>
                        <div class="text-[10px] text-slate-400">Android App</div>
                    </div>
                </a>
                <a href="https://apps.apple.com/us/app/streisand/id6450534064" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-slate-800/40 hover:bg-slate-700/60 transition border border-slate-700/50 group">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-lg font-bold text-white group-hover:bg-blue-600 transition-colors">
                        <i class="fab fa-apple"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-sm text-slate-200">Streisand</div>
                        <div class="text-[10px] text-slate-400">iOS App</div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-500 text-xs animate-fade-in pb-4" style="animation-delay: 0.3s;">
            <p>Made with ❤️ by Turbo VPN</p>
        </footer>

    </main>

    <script>
        // Generate QR Code
        var subUrl = document.getElementById("subLink").value;
        new QRCode(document.getElementById("qrcode"), {
            text: subUrl,
            width: 140,
            height: 140,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        // Copy Function
        function copyLink() {
            var copyText = document.getElementById("subLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            
            var msg = document.getElementById("copyMsg");
            msg.style.opacity = "1";
            setTimeout(function(){ msg.style.opacity = "0"; }, 2000);
        }
    </script>
</body>
</html>
