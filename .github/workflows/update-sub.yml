name: Update Subscription Mirror

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-sub:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Download Data
      run: |
        curl -L "https://90900090.ir/wp-admin/admin-ajax.php?action=export_healthy_servers&format=subscription" -o sub.txt
        curl -L "https://90900090.ir/wp-admin/admin-ajax.php?action=export_healthy_servers&format=json" -o servers.json

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        if [[ -n $(git status -s) ]]; then
          git add sub.txt servers.json
          git commit -m "Auto-update data: $(date)"
          git push
        else
          echo "No changes."
        fi
