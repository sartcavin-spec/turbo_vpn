name: Update Subscription Mirror

on:
  schedule:
    - cron: '*/15 * * * *' # Run every 15 minutes
  workflow_dispatch: # Allow manual run

jobs:
  update-sub:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Download Subscription Data
      run: |
        # Download from your WordPress site
        curl -L "https://90900090.ir/wp-admin/admin-ajax.php?action=export_healthy_servers&format=subscription" -o sub.txt

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Check for changes
        if [[ -n $(git status -s) ]]; then
          git add sub.txt
          git commit -m "Auto-update subscription: $(date)"
          git push
        else
          echo "No changes in subscription data."
        fi
